# Biz-Salama backend lint config.
# Single source of truth for what counts as a real bug vs. a false positive.
# Future code-review reports should match what `ruff check .` produces here.
#
# Run locally:  cd /app/backend && ruff check .
# Auto-fix:     cd /app/backend && ruff check --fix .

target-version = "py311"
line-length = 120
extend-exclude = [
    "scripts/",  # one-shot dev utilities, not production paths
    "tests/__pycache__",
]

[lint]
# Enable: pycodestyle errors, pyflakes (undefined names = real bugs),
# bugbear (likely-bug patterns), simplify, complexity (mccabe).
select = [
    "E",   # pycodestyle errors — incl. E711 (compare to None with `is`)
    "F",   # pyflakes — undefined names, unused imports
    "B",   # bugbear — likely-bug patterns
    "SIM", # simplify — overly verbose idioms
    "UP",  # pyupgrade — modernise legacy syntax
    "C90", # mccabe complexity — keep functions tractable
    "S",   # bandit security
]

# Deliberate ignores — each one documents WHY (see CODE_REVIEW_ALLOWLIST.md).
ignore = [
    # E501 — long lines are fine when they contain SQL/HMAC/log strings.
    "E501",
    # B008 — FastAPI uses `param: Type = Depends(...)` in signatures; that's
    # the framework's documented pattern.
    "B008",
    # S101 — `assert` is the pytest idiom; we never rely on it in prod paths.
    "S101",
    # S104 — bind to 0.0.0.0 is required because uvicorn runs behind the
    # Kubernetes ingress.
    "S104",
    # S105/S106/S107 — false positive on Pydantic field default strings that
    # happen to contain "password" or "secret" as part of an enum/label.
    "S105", "S106", "S107",
    # S110/S112 — silent `except` is intentional in the SMS / payment-mock
    # paths (graceful degradation when no AT key is set).
    "S110", "S112",
    # S311 — `random` is fine for non-cryptographic test-fixture phone numbers
    # and price-noise jitter. Anywhere we need crypto we already use `secrets`.
    "S311",
    # SIM108 — ternary-vs-if-else is a stylistic choice; we keep multi-line
    # `if/else` for clarity in money/price flows.
    "SIM108",
    # SIM117 — combined `with` is harder to read with motor's async ctxs.
    "SIM117",
    # UP007 — keeping `Optional[X]` for Python 3.10 compat where libs require it.
    "UP007",
    # E712 — `is True`/`is False` in pytest assertions: we already migrated the
    # repo to `assert expr` / `assert not expr`. Re-enabling would flag future
    # regressions, but ruff's strict reading of E712 also catches harmless
    # Pydantic `Field(default=False)` patterns. Keeping it lenient.
]

# Max cyclomatic complexity. Anything above this needs justification or a
# refactor. We tuned it to 12 after the Round 2 refactors landed.
mccabe.max-complexity = 12

[lint.per-file-ignores]
# Test files routinely use `assert <const>` patterns and inline secrets that
# are documented test fixtures (see /app/memory/test_credentials.md). They
# also exercise edge cases that look like bugs in isolation.
"tests/*.py" = ["S101", "S105", "S106", "S311", "C901"]
# server.py is the historical monolith; complexity-cap waivers documented in
# CODE_REVIEW_ALLOWLIST.md. New routes must respect the global C901 limit.
"server.py" = ["C901"]
